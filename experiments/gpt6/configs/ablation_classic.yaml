experiment:
  name: gpt6_ablation_classic
  description: "GPT-6 Ablation A: Classic LayerNorm + GELU + LearnedPos on FineWeb-Edu"
  family: gpt6_ablation

model:
  vocab_size: 8192
  embedding_dim: 256
  max_context_length: 256
  num_heads: 8
  feed_forward_dim: 1024
  num_layers: 6
  norm_type: layernorm
  ffn_type: gelu
  pos_encoding: learned
  tie_weights: false

training:
  batch_size: 32
  learning_rate: 6.0e-4
  lr_schedule: cosine
  warmup_steps: 200
  min_lr_ratio: 0.1
  grad_clip: 1.0
  use_amp: true
  train_steps: 2000
  val_interval: 250
  seed: 42

data:
  tokenizer_path: data/fineweb_edu/fineweb_bpe_8192.json
  tokenizer_type: subword
  data_dir: data/fineweb_edu

paths:
  checkpoint_dir: checkpoints/gpt6/ablation_classic
  results_dir: experiments/gpt6/results

