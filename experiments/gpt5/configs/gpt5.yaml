experiment:
  name: gpt5
  description: "GPT-5: Frozen GPT-4 6-layer architecture trained on expanded TinyStories subset"
  family: gpt5

model:
  vocab_size: 512
  embedding_dim: 32
  max_context_length: 64
  num_heads: 4
  feed_forward_dim: 128
  num_layers: 6

training:
  batch_size: 16
  learning_rate: 3.0e-4
  train_steps: 10000
  val_interval: 250
  seed: 42

data:
  tokenizer_path: data/processed/gpt3_tokenizer.json
  tokenizer_type: subword
  data_dir: data/gpt5

paths:
  checkpoint_dir: checkpoints/gpt5
  results_dir: experiments/gpt5/results

